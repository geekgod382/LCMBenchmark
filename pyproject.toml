[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legacy-code-modernization-benchmark"
version = "0.1.0"
description = "A benchmark for translating legacy programs into modern languages."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
legacy-modernization-score = "legacy_modernization_benchmark.score:main"
legacy-modernization-package = "legacy_modernization_benchmark.package_release:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]